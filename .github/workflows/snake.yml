name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Snake Animation
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: doubty
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#fcee0a&color_dots=#161616,#00f0ff44,#00f0ff88,#00f0ffcc,#00f0ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
